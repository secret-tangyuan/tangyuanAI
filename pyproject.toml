[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangyuanAI"
version = "1.2.0"
description = "Lightweight multi-agent collaboration framework on top of LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Secret Tangyuan" }]
keywords = ["llm", "agent", "multi-agent", "mcp", "ai-framework", "anthropic", "claude", "async", "plugin", "rag", "image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "lxml>=6.0.2",          # XML 解析（test_xml_protocol 用，BeautifulSoup 'xml' feature 依赖）
    "mcp>=1.14.1",
    "openapi-spec-validator>=0.7",   # v1.1.1+ 验证 OpenAI ChatGPT Plugin 1.0 的 OpenAPI 3.0 spec
    "pydantic>=2.6",
    "python-dotenv>=1.0",  # mcp 间接依赖（pydantic_settings 需要）
    "pyyaml>=6.0",
    "watchdog>=3.0",
    # Knowledge Base 子系统（vendored 默认实现）
    "qdrant-client>=1.10",             # 向量库（embedded + server 双模式）
    "langchain-text-splitters>=0.3",   # 文本切分
    "unstructured>=0.15",              # 文档加载（PDF/DOCX/HTML/MD/...）
    "tenacity>=9.0",                   # 失败重试
    "msgpack>=1.0",                    # 嵌入缓存压缩
    "tiktoken>=0.7",                   # token-aware batching
]

[project.optional-dependencies]
# A2A 导出（核心原生支持；把本地 agent 暴露为 A2A HTTP endpoint）
a2a = ["aiohttp>=3.9"]

# KB / Image 子系统的额外 provider 依赖（默认实现已 vendored 在主包）。
# 想换/扩 KB provider（cohere / voyage / jina / BGE / ColBERT / MonoT5 / minerU
# / paddleocr 等）时装对应的 extra；图片生成额外 provider 用 ``tangyuanai plugin
# install <git-url>`` 从 git 装第三方包。
kb-embed-cohere = ["cohere>=5.5"]
kb-embed-voyage  = ["voyageai>=0.2"]
kb-rerank-cohere = ["cohere>=5.5"]
kb-rerank-local  = ["sentence-transformers>=2.2", "torch>=2.0"]  # BGE / ColBERT / MonoT5
kb-processor-mineru    = ["magic-pdf[full]>=0.6"]
kb-processor-paddleocr = ["paddleocr>=2.7", "paddlepaddle>=2.5"]

[project.urls]
Homepage = "https://github.com/secret-tangyuan/tangyuanAI"
Repository = "https://github.com/secret-tangyuan/tangyuanAI.git"
Issues = "https://github.com/secret-tangyuan/tangyuanAI/issues"

# CLI 命令：pip install 后 `tangyuanai` 可用
[project.scripts]
tangyuanai = "tangyuanAI.cli:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.setuptools]
packages = ["tangyuanAI", "tangyuanAI.kb", "tangyuanAI.imaging"]
package-dir = {"tangyuanAI" = "."}
include-package-data = true

# docs-site/（VitePress 文档站 + FastAPI 后端）绝不进 wheel / sdist ——
# 它只是本仓库的文档工具，不是 Python 包；排除避免污染用户安装。
[tool.setuptools.exclude-package-data]
"*" = ["docs-site/**/*", "docs-site/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 默认跑：单测（跳过 benchmark + flaky）。跑 benchmark 用 ``pytest -m benchmark``；
# 跑 flaky（网络敏感/并发竞争）用 ``pytest -m flaky`` 显式跑。
addopts = "-ra -m 'not benchmark and not flaky'"
markers = [
    "benchmark: 性能基准测试（默认跳过；用 -m benchmark 显式跑）",
    "flaky: 已知不稳定（网络敏感 / mock 队列竞争），默认跳过；用 -m flaky 显式跑",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
